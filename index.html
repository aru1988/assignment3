<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tamil Nadu Police - Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07111f;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 370px;
      padding: 30px;
      text-align: center;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      color: #0b3d91;
      font-size: 25px;
      margin: 5px 0;
    }

    .demo {
      color: #d32f2f;
      font-weight: bold;
      font-size: 13px;
      margin: 15px 0 25px;
    }

    label {
      display: block;
      text-align: left;
      margin: 12px 0 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0b3d91;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #072b67;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- Logo image -->
    <img src="1.png" alt="Tamil Nadu Police Logo" class="logo">

    <h1>TAMIL NADU POLICE</h1>

    <div class="demo">
      DEMO / EDUCATIONAL PAGE
    </div>

    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      placeholder="Enter username"
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button type="button">
      Demo Login
    </button>

    <div class="notice">
      This is a demonstration webpage and is not an official
      Tamil Nadu Police website.
    </div>

  </div>

</body>
</html>
