<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamil Nadu Police - Demo</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07111f;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 350px;
      padding: 35px;
      text-align: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    h1 {
      color: #0b3d91;
      margin-bottom: 10px;
    }

    .demo {
      color: #d32f2f;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      margin: 12px 0 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0b3d91;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #072b67;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>TAMIL NADU POLICE</h1>

    <div class="demo">
      DEMO / EDUCATIONAL PAGE
    </div>

    <label>Username</label>
    <input type="text" placeholder="Enter username">

    <label>Password</label>
    <input type="password" placeholder="Enter password">

    <button type="button">Demo Login</button>
  </div>

</body>
</html>
